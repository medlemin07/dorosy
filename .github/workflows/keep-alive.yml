name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch: {}

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent auto-pause
        run: |
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
            "https://ooyyxxlfbiswkeedptwp.supabase.co/rest/v1/subjects?select=id&limit=1" \
            -H "apikey: sb_publishable_LiYs_p3BSIX0z_GvNTUKzw_XdgVrVUc" \
            -H "Authorization: Bearer sb_publishable_LiYs_p3BSIX0z_GvNTUKzw_XdgVrVUc"
